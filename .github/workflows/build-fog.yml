
name: Build NFS5 Enhanced Fog Fix

on:
  workflow_dispatch:
  
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4
with:
  repository: iArtorias/nfs5_enhanced
  ref: 60b9577

      - name: Configure CMake
        run: cmake -S . -B build -A Win32

      - name: Build Release
        run: cmake --build build --config Release

      - name: Collect DX11 driver
        shell: pwsh
        run: |
          $dll = Get-ChildItem build -Filter dx11z.dll -Recurse |
            Select-Object -First 1

          if (-not $dll) {
            throw "dx11z.dll was not found!"
          }

          New-Item -ItemType Directory -Force -Path artifact
          Copy-Item $dll.FullName artifact/dx11z.dll

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: NFS5-Enhanced-Fog-Fix
          path: artifact/dx11z.dll
          if-no-files-found: error
