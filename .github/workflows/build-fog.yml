
name: Build NFS5 Enhanced Fog Fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: iArtorias/nfs5_enhanced
          ref: master
          fetch-depth: 0

      - name: Show source commit
        run: git log -1 --oneline

      - name: Configure CMake
        run: cmake -S . -B build -A Win32

      - name: Compile Release
        run: cmake --build build --config Release --parallel


      - name: Find and collect DLL
        shell: pwsh
        run: |
          Write-Host "Searching entire workspace for DLL files..."

          $dlls = Get-ChildItem . -Filter *.dll -Recurse -File |
            Where-Object { $_.FullName -notmatch '\\artifact\\' }

          $dlls | ForEach-Object {
            Write-Host "$($_.FullName) - $($_.Length) bytes"
          }

          $dll = $dlls |
            Where-Object { $_.Name -eq "dx11z.dll" } |
            Select-Object -First 1

          if (-not $dll) {
            throw "dx11z.dll not found. See DLL listing above."
          }

          New-Item -ItemType Directory -Force -Path artifact
          Copy-Item $dll.FullName artifact/dx11z.dll


      - name: Upload compiled DLL
        uses: actions/upload-artifact@v4
        with:
          name: NFS5-Enhanced-Fog-Fix
          path: artifact/dx11z.dll
          if-no-files-found: error
          retention-days: 14
