
name: Build NFS5 Enhanced Fog Fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: iArtorias/nfs5_enhanced
          ref: master
          fetch-depth: 0

      - name: Show source commit
        run: git log -1 --oneline

      - name: Configure CMake
        run: cmake -S . -B build -A Win32

      - name: Compile Release
        run: cmake --build build --config Release --parallel

      - name: Find and collect DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem build -Filter dx11z.dll -Recurse |
            Select-Object -First 1

          if (-not $dll) {
            Write-Host "DLL not found. Build output:"
            Get-ChildItem build -Recurse
            throw "dx11z.dll was not generated."
          }

          New-Item -ItemType Directory -Force -Path artifact
          Copy-Item $dll.FullName artifact/dx11z.dll

      - name: Upload compiled DLL
        uses: actions/upload-artifact@v4
        with:
          name: NFS5-Enhanced-Fog-Fix
          path: artifact/dx11z.dll
          if-no-files-found: error
          retention-days: 14
